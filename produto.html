<!DOCTYPE html>
<html lang="pt-BR">
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Produto | Volpe Crochê</title>

        <!--GOOGLE FONTE-->

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link
          href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
          rel="stylesheet"
          >

          <!--CSS-->

          <link
          rel="stylesheet"
          href="../css/style.css"
          >

    </head>
    <body>

        <!--NAVBAR-->

        <header>
            <nav class="navbar">
                <!--LOGO-->

                <div class="logo">
                    <a
                      href="../index.html"
                      class="logo-link"
                      >

                      <img
                        src="../imagens/LOGO/raposaf.png"
                        class="raposa"
                        >

                        <h2 class="logo-texto">
                            Volpe<br>
                            Crochê
                        </h2>

                    </a>
                </div>
                <!--MENU-->
                <ul class="menu">

                    <li>
                        <a href="cropped.html">
                            Cropped
                        </a>
                    </li>

                    <li>
                        <a href="short.html">
                            Short
                        </a>
                    </li>

                    <li>
                        <a href="vestido.html">
                            Vestido
                        </a>
                    </li>

                    <li>
                        <a href="Infantil.html">
                            Infantil
                        </a>
                    </li>

                    <li>
                        <a href="masculino.html">
                            Masculino
                        </a>
                    </li>
                </ul>

                <!--PESQUISA-->
                <div class="pesquisa">

                    <input
                    type="search"
                    class="srch"
                    placeholder="Buscar peças..."
                    >

                    <button class="btn">
                    </button>
                </div>
            </nav>

        </header>

        <!--CONTEUDO PRINCIPAL-->

        <main>

            <!--PRODUTO-->

            <section class="produto">
                <div class="produto-conteudo">

                    <!--IMAGEM DO PRODUTO-->

                    <div class="produto-imagem">

                        <img
                          id="produto-imagem"
                          src=""
                          alt=""
                          >

                        <div id="produto-miniaturas" class="produto-miniaturas">
                        </div>

                    </div>

                    <!--INFORMAÇÕES DO PRODUTO-->

                    <div class="produto-informacoes">

                        <!--CATEGORIA-->

                        <p
                           id="produto-categoria"
                           class="produto-categoria"
                           ></p>

                           <!--NOME-->

                           <h1
                             id="produto-nome"
                             ></h1>

                             <p
                               id="produto-preco"
                               class="produto-preco"
                               ></p>

                               <!--DESCRIÇÃO-->

                               <div class="produto-descricao">

                                <p
                                   id="produto-descricao"
                                   ></p>

                               </div>

                               <!--TAMANHO E COR LADO A LADO-->

                               <div class="produto-variacoes">

                                <div class="produto-opcao">

                                    <h3>
                                        Tamanho
                                    </h3>

                                    <select id="produto-tamanho">

                                        <option value="">
                                            Selecione o tamanho
                                        </option>

                                    </select>

                                </div>

                                <div class="produto-opcao">

                                    <h3>
                                        Cor
                                    </h3>

                                    <select id="produto-cor">

                                        <option value="">
                                            Selecione a cor
                                        </option>

                                    </select>

                                </div>

                               </div>

                               <!--ENCOMENDA-->

                               <div class="produto-acao">

                                <a
                                  href="encomenda.html"
                                  class="btn-produto"
                                  >
                                      Fazer encomenda
                                    </a>

                               </div>

                       </div>
                </div>
            </section>

            <!--DETALHES DA PEÇA-->

            <section class="detalhes-produto">

                <h2>
                    Sobre a peça
                </h2>

                <div class="detalhes-conteudo">

                    <!--MATERIAL-->

                    <div class="detalhe">

                        <h3>
                            Material
                        </h3>

                        <p
                           id="produto-material"
                           ></p>

                    </div>

                    <!--PRODUÇÃO-->

                    <div class="detalhe">

                        <h3>
                            Produção
                        </h3>

                        <p
                           id="produto-producao"
                           ></p>

                    </div>

                </div>
            </section>

            <!--ENCOMENDA DA PEÇA-->

            <section class="encomenda">

                <div class="encomenda-conteudo">

                    <h2>
                        Quer esse modelo em outra cor?
                    </h2>

                    <p>
                        Entre em contato e consulte as possibilidades.
                    </p>

                    <a
                       href="encomenda.html"
                       class="btn-encomenda"
                       >
                         Faça sua encomenda
                        </a>
                </div>
            </section>
        </main>

        <!--RODAPÉ-->

        <footer>

        </footer>

        <!--JAVASCRIPT-->

        <script src="../java/script.js"></script>
    </body>
</html>
